<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DecoVentory - Login</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main>
        <div class="top-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="#98b4eb" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-archive-icon lucide-archive"><rect width="20" height="5" x="2" y="3" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/></svg>  
        </div>
        <h2>Welcome to DecoVentory</h2>
        <p class="main-text">
            The centralized inventory for materials and resources. <br>
            Please select your access level to continue.
        </p>https://www.primevideo.com/detail/0OSBVC1DKTXBVUO97CLO8DC5E1/ref=atv_hm_hom_c_OB743808_brws_6_1?jic=44%7CCgtmcmVld2l0aGFkcxIMc3Vic2NyaXB0aW9uEgRzdm9k
        <a href="../ExecLogin/index.html">
            <button>
                <h3>Executive Login</h3>
                <span class="small-text">Access administrative features and edit records</span>
                <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-right-icon lucide-arrow-right"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
            </button>
        </a> 
        <a href="../Dashboard/index.html" id="viewerBtn">
            <button>
                <h3>Continue as Viewer</h3>
                <span class="small-text">Browse view-only inventory</span>
                <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye-icon lucide-eye"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
        </a>
        <script>
            // Mark as viewer when clicking viewer button
            document.getElementById('viewerBtn').addEventListener('click', () => {
                localStorage.setItem('decoventory_role', 'viewer');
            });
        </script>
    </main>
</body>
</html>
