        <section class="main-section">
            <h1>Resource Overview</h1>
            <ul class="content-list">
                <li class="content-list-item">
                    <span class="item-state center grey-text">Total Resources</span>
                    <span class="numbers center"></span>
                </li>
                <li class="content-list-item">
                    <span class="item-state center grey-text">Items Available <br> &lpar;In-Store&rpar;</span>
                    <span class="numbers center"></span>
                </li>
                <li class="content-list-item">
                    <span class="item-state center grey-text">Items in Chapel</span>
                    <span class="numbers center"></span>
                </li>
                <li class="content-list-item">
                    <span class="item-state center grey-text">Items in Other Locations</span>
                    <span class="numbers center"></span>
                </li>
                <li class="content-list-item">
                    <span class="item-state center grey-text">Items Rented Out</span>
                    <span class="numbers center"></span>
                </li>

                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="search-icon"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                </div>
                <select name="select-category" class="filter-select" id="category-select">
                    <option value="All Categories">All Categories</option>
                    <option value="Fabrics">Fabrics</option>
                    <option value="Tools">Tools</option>
                    <option value="Others">Others</option>
                </select>
                <select name="select-status" class="filter-select" id="status-select">

                    <option value="Voile">Voile</option>
                    <option value="Satin">Satin</option>
                    <option value="Hand Tools">Hand Tools</option>
                    <option value="Equipment">Equipment</option>
                    <option value="Miscellaneous">Miscellaneous</option>
                </select>
                <button class="apply-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="filter-icon"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>

                </button>
