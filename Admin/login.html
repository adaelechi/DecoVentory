<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DecoVentory - Admin Login</title>
    <link rel="icon" type="image/jpeg" href="../assets/logo.jpeg">
    <link rel="stylesheet" href="../assets/global.css">
    <link rel="stylesheet" href="../assets/toast.css">
    <link rel="stylesheet" href="../assets/toast.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: var(--bg-primary);
        }
        main {
            width: 100%;
            max-width: 400px;
            padding: 2.5rem;
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: var(--card-shadow);
            text-align: center;
            border: 1px solid var(--border-color);
        }
        .top-icon {
            margin-bottom: 1.5rem;
            display: inline-flex;
            padding: 1rem;
            background-color: var(--deco-red-muted);
            border-radius: 50%;
        }
        h2 {
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }
        .main-text {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }
        .pass-token {
            position: relative;
            text-align: left;
            margin-bottom: 1.5rem;
        }
        .pass-token label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-primary);
        }
        .pass-token input {
            width: 100%;
            padding: 0.8rem 1rem;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 1.2rem;
            letter-spacing: 0.5rem;
            text-align: center;
        }
        .eye-toggle {
            position: absolute;
            right: 1rem;
            top: 2.5rem;
            cursor: pointer;
            color: var(--text-secondary);
        }
        button {
            width: 100%;
            padding: 0.8rem;
            background-color: var(--deco-red);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #return-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 1.5rem;
            text-decoration: none;
            color: var(--text-secondary);
            transition: color 0.2s;
        }
        #return-link:hover {
            color: var(--deco-red);
        }
        .show { display: block; }
        .hide { display: none; }
    </style>
</head>
<body>
    <main>
        <div class="top-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--deco-red)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        </div>
        <h2>Admin Access</h2>
        <p class="main-text">
            Please enter your secure 6-digit access code to access the Admin dashboard.
        </p>
        <form action="" method="post">
            <div class="pass-token">
                <label for="token">Access Code</label>
                <input type="password" name="token" id="token" placeholder="- - - - - -" autocomplete="off" maxlength="6" inputmode="numeric" required>
                <div class="eye-toggle">
                    <svg id="eye-open" class="icon show" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                    <svg id="eye-closed" class="icon hide" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/></svg>
                </div>
            </div>
            <button type="submit">Authenticate</button>
        </form>
        <a href="../Dashboard/index.html" id="return-link">
            <svg id="back-arrow" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
            Return to Dashboard
        </a>
    </main>
    <script src="../assets/toast.js"></script>
    <script src="./login.js"></script>
</body>
</html>
