<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DecoVentory - Recent Decorations</title>
    <link rel="icon" type="image/jpeg" href="/assets/logo.jpeg">
    <link rel="stylesheet" href="/assets/global.css">
    <link rel="stylesheet" href="/assets/toast.css">
    <link rel="stylesheet" href="/Dashboard/style.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header>
        <nav class="nav-bar">
            <div class="brand">
                <img src="../assets/logo.jpeg" alt="DecoVentory logo" class="brand-logo">
                <h2>DecoVentory</h2>
            </div>
            <div class="nav-actions">
                <div class="nav-item toggle-theme">
                    <span class="slider"></span>
                    <svg class="sun-theme" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
                    <svg class="moon-theme" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/></svg>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <section class="sidebar">
            <ul class="sidebar_list">
                <li>
                    <a href="/Dashboard/index.html">
                        <svg class="item-svg" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
                        <span class="item-name">Dashboard</span>
                    </a>
                </li>
                <li>
                    <a href="/RentMaterials/index.html">
                        <svg class="item-svg" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-package"><path d="M16.5 9.4 7.5 4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.29 7 12 12 20.71 7"/><line x1="12" y1="22" x2="12" y2="12"/></svg>
                        <span class="item-name">Rent Materials</span>
                    </a>
                </li>
                <li class="active">
                    <a href="#">
                        <svg class="item-svg" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 11-1.296-1.296a2.4 2.4 0 0 0-3.408 0L11 16"/><path d="M4 8a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2"/><circle cx="13" cy="7" r="1" fill="currentColor"/><rect x="8" y="2" width="14" height="14" rx="2"/></svg>
                        <span class="item-name">Decorations</span>
                    </a>
                </li>
                <!-- Tablet-only nav items (hidden on desktop) -->
                <li class="tablet-nav-admin admin-link" style="cursor: pointer;">
                    <a href="javascript:void(0)">
                        <svg class="item-svg" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
                        <span class="item-name">Admin</span>
                    </a>
                </li>
                <li class="tablet-nav-admin" id="tabletLogoutBtn" style="cursor: pointer;">
                    <a href="javascript:void(0)">
                        <svg class="item-svg" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                        <span class="item-name" style="color: #C54344;">Logout</span>
                    </a>
                </li>
            </ul>
            <div class="sidebar-footer">
                <div class="settings admin-link" style="cursor: pointer;">
                    <svg class="item-svg lucide lucide-shield-check" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
                    <span class="item-name">Admin</span>
                </div>
                <div id="logoutBtn" class="logout-link" style="cursor: pointer;">
                    <svg class="item-svg" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    <span class="item-name" style="color: #C54344;">Logout</span>
                </div>
            </div>
        </section>

        <section class="mainbar loading-opacity">
            <section class="main-section">
                <div class="header-with-action">
                    <h1>Recent Decorations</h1>
                    <button id="addDecorationBtn" class="add-btn admin-only" style="display: none;">
                        <svg class="add-svg" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                        <span class="add-item">Add Decoration</span>
                    </button>
                </div>
                
                <div class="gallery-grid" id="galleryGrid">
                    <!-- Gallery skeletons -->
                    <div class="gallery-item">
                        <div class="skeleton skeleton-image" style="height: 300px; width: 100%;"></div>
                    </div>
                    <div class="gallery-item">
                        <div class="skeleton skeleton-image" style="height: 300px; width: 100%;"></div>
                    </div>
                    <div class="gallery-item">
                        <div class="skeleton skeleton-image" style="height: 300px; width: 100%;"></div>
                    </div>
                </div>
            </section>
        </section>
    </main>

    <!-- Project Detail Modal -->
    <div class="details-modal" id="projectModal">
        <div class="details-modal__backdrop" id="closeProjectModal"></div>
        <div class="details-modal__panel project-panel">
            <div class="details-modal__header">
                <h2 id="projectTitle">Project Name</h2>
                <button type="button" class="details-close" id="closeProjectBtn">&times;</button>
            </div>
            <div class="project-content">
                <div class="project-carousel-wrapper">
                    <div class="project-images-carousel" id="projectCarousel">
                        <!-- Images will be injected here -->
                    </div>
                    <button class="carousel-nav prev" id="prevImage">&lsaquo;</button>
                    <button class="carousel-nav next" id="nextImage">&rsaquo;</button>
                </div>
                <div class="project-info">
                    <p class="project-caption" id="displayCaption"></p>
                    <p class="project-date">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px; vertical-align: middle; color: var(--deco-red);"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                        <span id="projectDate"></span>
                    </p>
                    <p class="project-venue">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px; vertical-align: middle; color: var(--deco-red);"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
                        <span id="projectVenue"></span>
                    </p>
                    <div class="project-actions">
                        <a href="#" id="instagramLink" target="_blank" class="instagram-btn">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="20" x="2" y="2" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
                            View on Instagram
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Decoration Modal (Admin Only) -->
    <div class="details-modal" id="addDecorationModal">
        <div class="details-modal__backdrop" id="closeAddModal"></div>
        <div class="details-modal__panel">
            <div class="details-modal__header">
                <h2>Add Recent Decoration</h2>
                <button type="button" class="details-close" id="closeAddBtn">&times;</button>
            </div>
            <form id="addDecorationForm">
                <div class="form-group">
                    <label for="eventName">Event Name</label>
                    <input type="text" id="eventName" required placeholder="e.g. Chapel Decorations">
                </div>
                <div class="form-group">
                    <label for="venue">Venue</label>
                    <input type="text" id="venue" required placeholder="e.g. Chapel">
                </div>
                <div class="form-group">
                    <label for="eventDate">Date</label>
                    <input type="date" id="eventDate" required>
                </div>
                <div class="form-group">
                    <label for="instagramUrl">Instagram Link (Optional)</label>
                    <input type="url" id="instagramUrl" placeholder="https://www.instagram.com/p/...">
                </div>
                <div class="form-group">
                    <label for="projectCaption">Caption/Notes</label>
                    <textarea id="projectCaption" rows="3" placeholder="Describe this decoration..."></textarea>
                </div>
                <div class="form-group">
                    <label for="decorationImages">Project Images (Bulk Upload)</label>
                    <input type="file" id="decorationImages" multiple accept="image/*" class="file-input">
                    <p class="help-text">You can select multiple images at once.</p>
                </div>
                <div class="details-actions">
                    <button type="button" class="details-secondary" id="cancelAdd">Cancel</button>
                    <button type="submit" class="details-primary">Save Project</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/assets/toast.js"></script>
    <script src="/api.js"></script>
    <script src="main.js"></script>
</body>
</html>
